<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9567f4"/>
      <stop offset="100%" stop-color="#6c4fd6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3d23a8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Inner highlight -->
  <rect x="4" y="4" width="56" height="26" rx="12" fill="white" opacity="0.10"/>

  <!-- Document icon (white) -->
  <g filter="url(#shadow)" transform="translate(14, 8)">
    <!-- Page body -->
    <path d="M8 2 L24 2 L24 8 L30 8 L30 48 L2 48 L2 8 Z"
          fill="white" opacity="0.0"/>
    <path d="M6 2 C4.9 2 4 2.9 4 4 L4 44 C4 45.1 4.9 46 6 46 L30 46 C31.1 46 32 45.1 32 44 L32 10 L22 10 L22 2 Z"
          fill="white" opacity="0.92"/>
    <!-- Folded corner -->
    <path d="M22 2 L22 10 L32 10 Z"
          fill="white" opacity="0.55"/>
    <!-- Lines on document -->
    <line x1="8" y1="18" x2="26" y2="18" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="24" x2="26" y2="24" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="30" x2="20" y2="30" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
